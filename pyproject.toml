[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unifi-fw-updater"
version = "0.1.0"
description = "CLI tool for local UniFi device firmware updates"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "rich>=13.0",
    "tenacity>=8.2",
    "urllib3>=2.0",
]

[project.scripts]
unifi-fw = "unifi_fw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unifi_fw"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.mypy]
strict = true
python_version = "3.11"
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = "tenacity.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=unifi_fw --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["unifi_fw"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "mypy>=1.8",
    "ruff>=0.3",
    "types-requests>=2.31",
    "types-pyyaml>=6.0",
]
